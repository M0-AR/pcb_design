<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Page not found · PCB Design Studio</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #06090f;
      --panel: #0c121c;
      --line: #1d2a3a;
      --text: #e6edf6;
      --muted: #8fa3b8;
      --mint: #5eead4;
      --amber: #fbbf24;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 15% 10%, rgba(94, 234, 212, 0.12), transparent 35%),
        radial-gradient(circle at 85% 90%, rgba(251, 191, 36, 0.10), transparent 40%),
        var(--bg);
      color: var(--text);
      font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main {
      width: min(640px, 100%);
      padding: 40px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--panel);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
    }
    .eyebrow {
      color: var(--mint);
      font: 600 11px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }
    h1 { margin: 12px 0 8px; font-size: clamp(28px, 5vw, 44px); line-height: 1.1; }
    p { margin: 0 0 24px; color: var(--muted); }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; }
    a {
      display: inline-block;
      padding: 10px 16px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--text);
      text-decoration: none;
      font-weight: 600;
    }
    a.primary { border-color: transparent; background: var(--mint); color: #06221d; }
    a:focus-visible { outline: 2px solid var(--amber); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <span class="eyebrow">404 / trace not found</span>
    <h1>This route has no return path.</h1>
    <p>The page you asked for is not on this board. Head back to the studio and pick a net from the navigation.</p>
    <div class="actions">
      <a class="primary" href="/pcb_design/">Open the studio</a>
      <a href="https://github.com/M0-AR/pcb_design">View the repository</a>
    </div>
  </main>
</body>
</html>
